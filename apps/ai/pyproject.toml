[project]
name = "hr-agent-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "langgraph>=0.4,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
  "google-genai>=1.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
