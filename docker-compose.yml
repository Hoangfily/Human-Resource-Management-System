services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_agent}
      POSTGRES_USER: ${POSTGRES_USER:-hr_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hr_agent}:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/${POSTGRES_DB:-hr_agent}?schema=public
      REDIS_URL: redis://redis:6379/0
      AI_API_BASE_URL: http://ai:8000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: infra/docker/ai.Dockerfile
    environment:
      PORT: 8000
      API_BASE_URL: http://api:3000
      # Same values as the api service. Empty tokens make /evaluate answer 503 (fail closed).
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_INBOUND_TOKEN: ${AI_INBOUND_TOKEN:-}
      # Without a key the service runs "degraded": every request is escalated to a human.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-gemini-3.5-flash}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "${AI_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  postgres_data:
